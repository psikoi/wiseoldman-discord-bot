name: Type Check

on:
  push:
    branches:
      - master
    paths-ignore:
      - 'docs/**'

jobs:
  type-check:
    name: Run Type Checking
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18.17.0

      - name: Install dependencies
        run: npm i

      - name: Run tsc
        run: npx tsc
